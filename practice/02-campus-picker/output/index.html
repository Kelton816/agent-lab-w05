<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課間我想做什麼？ · 活動挑選器</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      margin-top: 10px;
    }
    .disclaimer {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 0.88rem;
      text-align: center;
      margin-bottom: 16px;
      font-weight: 500;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
    }
    .lang-btn {
      background: #e2e8f0;
      color: #334155;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.88rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .lang-btn:hover {
      background: #cbd5e1;
    }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .filter-group {
      margin-bottom: 16px;
    }
    .filter-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #334155;
    }
    .radio-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .radio-option {
      flex: 1;
      min-width: 80px;
    }
    .radio-option input[type="radio"] {
      display: none;
    }
    .radio-option label {
      display: block;
      text-align: center;
      padding: 8px 12px;
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.15s;
    }
    .radio-option input[type="radio"]:checked + label {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
    .checkbox-group {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #334155;
    }
    .checkbox-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--primary);
    }
    .checkbox-group label {
      cursor: pointer;
      user-select: none;
    }
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    .btn {
      flex: 1;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      text-align: center;
    }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    .shortcut-hint {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 10px;
    }
    .result-section {
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }
    .result-section.has-result {
      border: 2px solid #3b82f6;
      background: #eff6ff;
      animation: popIn 0.25s ease-out;
    }
    @keyframes popIn {
      0% { transform: scale(0.96); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }
    .result-badge {
      display: inline-block;
      background: #3b82f6;
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .result-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #1e293b;
    }
    .result-meta {
      display: flex;
      gap: 12px;
      font-size: 0.88rem;
      color: #475569;
      flex-wrap: wrap;
      justify-content: center;
    }
    .result-meta span {
      background: #ffffff;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #bfdbfe;
    }
    .no-match {
      color: var(--danger);
      font-weight: 600;
      font-size: 1rem;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .history-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #334155;
    }
    .btn-clear {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .btn-clear:hover {
      background: #fee2e2;
      color: var(--danger);
      border-color: #fca5a5;
    }
    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .history-item .item-id {
      font-weight: 700;
      color: var(--primary);
      margin-right: 8px;
    }
    .history-item .item-name {
      font-weight: 500;
      flex: 1;
    }
    .history-item .item-tags {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .history-empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
      padding: 14px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="disclaimer" id="disclaimer">
      教學模擬活動，不是校方公告
    </div>

    <div class="header">
      <h1 id="page-title">課間我想做什麼？</h1>
      <button class="lang-btn" id="lang-toggle" onclick="toggleLang()">EN</button>
    </div>

    <div class="card">
      <!-- Filter 1: Location -->
      <div class="filter-group">
        <span class="filter-label" id="label-location">地點類型</span>
        <div class="radio-options">
          <div class="radio-option">
            <input type="radio" name="location" id="loc-all" value="all" checked>
            <label for="loc-all" id="opt-loc-all">不限</label>
          </div>
          <div class="radio-option">
            <input type="radio" name="location" id="loc-indoor" value="indoor">
            <label for="loc-indoor" id="opt-loc-indoor">室內</label>
          </div>
          <div class="radio-option">
            <input type="radio" name="location" id="loc-outdoor" value="outdoor">
            <label for="loc-outdoor" id="opt-loc-outdoor">室外</label>
          </div>
        </div>
      </div>

      <!-- Filter 2: Time -->
      <div class="filter-group">
        <span class="filter-label" id="label-time">可用時間</span>
        <div class="radio-options">
          <div class="radio-option">
            <input type="radio" name="time" id="time-15" value="15">
            <label for="time-15" id="opt-time-15">15 分鐘</label>
          </div>
          <div class="radio-option">
            <input type="radio" name="time" id="time-30" value="30" checked>
            <label for="time-30" id="opt-time-30">30 分鐘</label>
          </div>
          <div class="radio-option">
            <input type="radio" name="time" id="time-60" value="60">
            <label for="time-60" id="opt-time-60">60 分鐘</label>
          </div>
        </div>
      </div>

      <!-- Filter 3: Energy -->
      <div class="filter-group">
        <span class="filter-label" id="label-energy">活動強度</span>
        <div class="radio-options">
          <div class="radio-option">
            <input type="radio" name="energy" id="energy-all" value="all" checked>
            <label for="energy-all" id="opt-energy-all">不限</label>
          </div>
          <div class="radio-option">
            <input type="radio" name="energy" id="energy-low" value="low">
            <label for="energy-low" id="opt-energy-low">低強度</label>
          </div>
          <div class="radio-option">
            <input type="radio" name="energy" id="energy-medium" value="medium">
            <label for="energy-medium" id="opt-energy-medium">中強度</label>
          </div>
        </div>
      </div>

      <!-- Improvement 1: Prevent consecutive duplicate toggle -->
      <div class="checkbox-group">
        <input type="checkbox" id="chk-no-repeat" checked>
        <label for="chk-no-repeat" id="label-no-repeat">避免連續兩次抽到相同活動 (大於一項時生效)</label>
      </div>

      <!-- Buttons -->
      <div class="action-buttons">
        <button class="btn btn-primary" id="btn-pick" onclick="pickActivity()">幫我選</button>
        <button class="btn btn-secondary" id="btn-reset" onclick="resetFilters()">重設篩選</button>
      </div>
      <div class="shortcut-hint" id="shortcut-hint">
        ⌨️ 快捷鍵：按 <b>Space</b> 或 <b>Enter</b> 挑選，按 <b>Esc</b> 重設
      </div>
    </div>

    <!-- Result Display -->
    <div class="result-section" id="result-box">
      <span class="history-empty" id="result-placeholder">點擊上方「幫我選」開始挑選活動</span>
    </div>

    <!-- History -->
    <div class="card">
      <div class="history-header">
        <h2 id="history-title">最近成功抽選 (最新在前，最多5筆)</h2>
        <button class="btn-clear" id="btn-clear-history" onclick="clearHistory()">清除紀錄</button>
      </div>
      <ul class="history-list" id="history-list">
        <li class="history-empty" id="history-empty-msg">尚無成功抽選紀錄</li>
      </ul>
    </div>
  </div>

  <script>
    // Embedded activities data
    const activities = [
      {
        "id": "A01",
        "name_zh": "整理書包",
        "name_en": "Organize your bag",
        "location_type": "indoor",
        "minutes": 10,
        "energy": "low"
      },
      {
        "id": "A02",
        "name_zh": "畫一張小卡",
        "name_en": "Draw a small card",
        "location_type": "indoor",
        "minutes": 15,
        "energy": "low"
      },
      {
        "id": "A03",
        "name_zh": "寫三句讀書筆記",
        "name_en": "Write three study notes",
        "location_type": "indoor",
        "minutes": 10,
        "energy": "low"
      },
      {
        "id": "A04",
        "name_zh": "安靜讀兩頁書",
        "name_en": "Read two pages quietly",
        "location_type": "indoor",
        "minutes": 15,
        "energy": "low"
      },
      {
        "id": "A05",
        "name_zh": "排好明日待辦",
        "name_en": "Plan tomorrow’s tasks",
        "location_type": "indoor",
        "minutes": 20,
        "energy": "low"
      },
      {
        "id": "A06",
        "name_zh": "整理本機練習檔",
        "name_en": "Organize practice files",
        "location_type": "indoor",
        "minutes": 30,
        "energy": "medium"
      },
      {
        "id": "A07",
        "name_zh": "在合適位置慢走",
        "name_en": "Take a gentle walk in a suitable area",
        "location_type": "outdoor",
        "minutes": 15,
        "energy": "low"
      },
      {
        "id": "A08",
        "name_zh": "觀察天空並畫草圖",
        "name_en": "Observe the sky and sketch",
        "location_type": "outdoor",
        "minutes": 20,
        "energy": "low"
      },
      {
        "id": "A09",
        "name_zh": "在合適位置快走",
        "name_en": "Take a brisk walk in a suitable area",
        "location_type": "outdoor",
        "minutes": 30,
        "energy": "medium"
      },
      {
        "id": "A10",
        "name_zh": "規劃小組練習",
        "name_en": "Plan a group exercise",
        "location_type": "indoor",
        "minutes": 45,
        "energy": "medium"
      },
      {
        "id": "A11",
        "name_zh": "記錄自然色彩",
        "name_en": "Record colors in nature",
        "location_type": "outdoor",
        "minutes": 45,
        "energy": "low"
      },
      {
        "id": "A12",
        "name_zh": "構思下一次社團活動",
        "name_en": "Brainstorm a future club activity",
        "location_type": "indoor",
        "minutes": 60,
        "energy": "medium"
      }
    ];

    // State
    let currentLang = 'zh'; // 'zh' or 'en'
    let historyList = [];
    let currentResult = null; // currently displayed activity
    let lastPickedId = null; // for duplicate prevention

    const i18n = {
      zh: {
        pageTitle: '課間我想做什麼？',
        disclaimer: '教學模擬活動，不是校方公告',
        langBtn: 'EN',
        labelLocation: '地點類型',
        optLocAll: '不限',
        optLocIndoor: '室內',
        optLocOutdoor: '室外',
        labelTime: '可用時間',
        optTime15: '15 分鐘',
        optTime30: '30 分鐘',
        optTime60: '60 分鐘',
        labelEnergy: '活動強度',
        optEnergyAll: '不限',
        optEnergyLow: '低強度',
        optEnergyMedium: '中強度',
        labelNoRepeat: '避免連續兩次抽到相同活動 (大於一項時生效)',
        btnPick: '幫我選',
        btnReset: '重設篩選',
        shortcutHint: '⌨️ 快捷鍵：按 <b>Space</b> 或 <b>Enter</b> 挑選，按 <b>Esc</b> 重設',
        resultPlaceholder: '點擊上方「幫我選」開始挑選活動',
        noMatch: '沒有符合條件的活動',
        historyTitle: '最近成功抽選 (最新在前，最多5筆)',
        btnClearHistory: '清除紀錄',
        historyEmpty: '尚無成功抽選紀錄',
        minUnit: '分鐘',
        locIndoor: '室內',
        locOutdoor: '室外',
        energyLow: '低強度',
        energyMedium: '中強度'
      },
      en: {
        pageTitle: 'What should I do between classes?',
        disclaimer: 'Teaching simulation activity, not an official campus announcement',
        langBtn: '中文',
        labelLocation: 'Location',
        optLocAll: 'All',
        optLocIndoor: 'Indoor',
        optLocOutdoor: 'Outdoor',
        labelTime: 'Available Time',
        optTime15: '15 mins',
        optTime30: '30 mins',
        optTime60: '60 mins',
        labelEnergy: 'Energy Level',
        optEnergyAll: 'All',
        optEnergyLow: 'Low',
        optEnergyMedium: 'Medium',
        labelNoRepeat: 'Avoid picking the same activity twice in a row (when >1 available)',
        btnPick: 'Pick for me',
        btnReset: 'Reset Filters',
        shortcutHint: '⌨️ Shortcuts: Press <b>Space</b> or <b>Enter</b> to pick, <b>Esc</b> to reset',
        resultPlaceholder: 'Click "Pick for me" above to choose an activity',
        noMatch: 'No matching activities found',
        historyTitle: 'Recent Successful Picks (Latest first, max 5)',
        btnClearHistory: 'Clear History',
        historyEmpty: 'No successful picks yet',
        minUnit: 'mins',
        locIndoor: 'Indoor',
        locOutdoor: 'Outdoor',
        energyLow: 'Low energy',
        energyMedium: 'Medium energy'
      }
    };

    function updateLanguageUI() {
      const t = i18n[currentLang];
      document.title = t.pageTitle + ' · ' + (currentLang === 'zh' ? '活動挑選器' : 'Activity Picker');
      document.getElementById('disclaimer').textContent = t.disclaimer;
      document.getElementById('page-title').textContent = t.pageTitle;
      document.getElementById('lang-toggle').textContent = t.langBtn;
      document.getElementById('label-location').textContent = t.labelLocation;
      document.getElementById('opt-loc-all').textContent = t.optLocAll;
      document.getElementById('opt-loc-indoor').textContent = t.optLocIndoor;
      document.getElementById('opt-loc-outdoor').textContent = t.optLocOutdoor;
      document.getElementById('label-time').textContent = t.labelTime;
      document.getElementById('opt-time-15').textContent = t.optTime15;
      document.getElementById('opt-time-30').textContent = t.optTime30;
      document.getElementById('opt-time-60').textContent = t.optTime60;
      document.getElementById('label-energy').textContent = t.labelEnergy;
      document.getElementById('opt-energy-all').textContent = t.optEnergyAll;
      document.getElementById('opt-energy-low').textContent = t.optEnergyLow;
      document.getElementById('opt-energy-medium').textContent = t.optEnergyMedium;
      document.getElementById('label-no-repeat').textContent = t.labelNoRepeat;
      document.getElementById('btn-pick').textContent = t.btnPick;
      document.getElementById('btn-reset').textContent = t.btnReset;
      document.getElementById('shortcut-hint').innerHTML = t.shortcutHint;
      document.getElementById('history-title').textContent = t.historyTitle;
      document.getElementById('btn-clear-history').textContent = t.btnClearHistory;

      // Update current result display if any
      renderResult();
      renderHistory();
    }

    function toggleLang() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      updateLanguageUI();
    }

    function getFilters() {
      const location = document.querySelector('input[name="location"]:checked').value;
      const time = parseInt(document.querySelector('input[name="time"]:checked').value, 10);
      const energy = document.querySelector('input[name="energy"]:checked').value;
      const noRepeat = document.getElementById('chk-no-repeat').checked;
      return { location, time, energy, noRepeat };
    }

    function pickActivity() {
      const { location, time, energy, noRepeat } = getFilters();

      let matched = activities.filter(act => {
        // Location filter
        if (location !== 'all' && act.location_type !== location) return false;
        // Time filter: minutes must not exceed selected time
        if (act.minutes > time) return false;
        // Energy filter
        if (energy !== 'all' && act.energy !== energy) return false;
        return true;
      });

      if (matched.length === 0) {
        currentResult = { matched: false };
      } else {
        // If noRepeat is enabled and we have > 1 candidates, exclude the last picked one
        let candidates = matched;
        if (noRepeat && matched.length > 1 && lastPickedId) {
          const filtered = matched.filter(act => act.id !== lastPickedId);
          if (filtered.length > 0) {
            candidates = filtered;
          }
        }

        const randomIndex = Math.floor(Math.random() * candidates.length);
        const selected = candidates[randomIndex];
        lastPickedId = selected.id;
        currentResult = { matched: true, activity: selected };

        // Add to history (newest at front, max 5)
        historyList.unshift(selected);
        if (historyList.length > 5) {
          historyList.pop();
        }
      }

      renderResult();
      renderHistory();
    }

    function renderResult() {
      const box = document.getElementById('result-box');
      const t = i18n[currentLang];

      if (!currentResult) {
        box.className = 'result-section';
        box.innerHTML = `<span class="history-empty">${t.resultPlaceholder}</span>`;
        return;
      }

      if (!currentResult.matched) {
        box.className = 'result-section';
        box.innerHTML = `<span class="no-match">${t.noMatch}</span>`;
        return;
      }

      const act = currentResult.activity;
      box.className = 'result-section has-result';
      const name = currentLang === 'zh' ? act.name_zh : act.name_en;
      const locText = act.location_type === 'indoor' ? t.locIndoor : t.locOutdoor;
      const energyText = act.energy === 'low' ? t.energyLow : t.energyMedium;

      box.innerHTML = `
        <span class="result-badge">${act.id}</span>
        <div class="result-title">${name}</div>
        <div class="result-meta">
          <span>⏱️ ${act.minutes} ${t.minUnit}</span>
          <span>📍 ${locText}</span>
          <span>⚡ ${energyText}</span>
        </div>
      `;
    }

    function renderHistory() {
      const list = document.getElementById('history-list');
      const t = i18n[currentLang];

      if (historyList.length === 0) {
        list.innerHTML = `<li class="history-empty">${t.historyEmpty}</li>`;
        return;
      }

      list.innerHTML = historyList.map(act => {
        const name = currentLang === 'zh' ? act.name_zh : act.name_en;
        const locText = act.location_type === 'indoor' ? t.locIndoor : t.locOutdoor;
        const energyText = act.energy === 'low' ? t.energyLow : t.energyMedium;
        return `
          <li class="history-item">
            <span class="item-id">${act.id}</span>
            <span class="item-name">${name}</span>
            <span class="item-tags">${act.minutes} ${t.minUnit} · ${locText} · ${energyText}</span>
          </li>
        `;
      }).join('');
    }

    function resetFilters() {
      document.getElementById('loc-all').checked = true;
      document.getElementById('time-30').checked = true;
      document.getElementById('energy-all').checked = true;
      document.getElementById('chk-no-repeat').checked = true;
      // Do not clear history!
    }

    function clearHistory() {
      historyList = [];
      lastPickedId = null;
      renderHistory();
    }

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      // Ignore if focus is in an input
      if (e.target.tagName === 'INPUT' && e.target.type !== 'radio' && e.target.type !== 'checkbox') return;

      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        pickActivity();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        resetFilters();
      }
    });

    // Initialize
    updateLanguageUI();
  </script>
</body>
</html>
